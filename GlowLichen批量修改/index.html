<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Lichen 属性批量修改</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d9e1ec 100%);
            min-height: 100vh;
            color: #2c3e50;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 900px;
            max-width: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, .25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #1e6fd9, #2a7fe8);
            color: #fff;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        header p {
            font-size: 13px;
            opacity: .9;
            margin-top: 4px;
        }

        .body {
            padding: 22px 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field>label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        /* ---------- 拖拽上传区 ---------- */
        .drop-zone {
            position: relative;
            border: 2px dashed #b8c2d0;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            background: #fafcff;
            transition: .18s;
            user-select: none;
        }

        .drop-zone:hover {
            border-color: #1e6fd9;
            background: #f0f6ff;
        }

        .drop-zone.drag-over {
            border-color: #1e6fd9;
            background: #e6f0ff;
            transform: scale(1.005);
            box-shadow: 0 0 0 4px rgba(30, 111, 217, .15);
        }

        .drop-zone.has-file {
            padding: 16px 20px;
            border-style: solid;
            border-color: #1e6fd9;
            background: #eef5ff;
        }

        .drop-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .drop-title {
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
        }

        .drop-sub {
            font-size: 12px;
            color: #7a8699;
            margin-top: 6px;
        }

        .drop-zone.has-file .drop-icon,
        .drop-zone.has-file .drop-title,
        .drop-zone.has-file .drop-sub {
            display: none;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .file-name {
            font-weight: 600;
            color: #1e5db0;
            font-size: 14px;
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            font-size: 12px;
            color: #7a8699;
            background: #fff;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid #d8dee8;
        }

        .file-clear {
            background: transparent;
            border: none;
            color: #a0a8b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: .15s;
            line-height: 1;
        }

        .file-clear:hover {
            background: #ffe0e0;
            color: #d33;
        }

        /* ---------- 面设置 ---------- */
        .faces {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 14px;
            background: #f7f9fc;
            border-radius: 10px;
            border: 1px solid #e2e8f2;
        }

        .face-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #e2e8f2;
            transition: .15s;
            user-select: none;
            font-size: 13px;
        }

        .face-item:hover {
            border-color: #8fa8cc;
            background: #f0f5ff;
        }

        .face-item.checked {
            background: #e8f0fe;
            border-color: #1e6fd9;
        }

        .face-item input {
            display: none;
        }

        .face-item .box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid #b8c2d0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .15s;
            flex-shrink: 0;
        }

        .face-item.checked .box {
            background: #1e6fd9;
            border-color: #1a5cb0;
        }

        .face-item.checked .box::after {
            content: "✓";
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }

        .quick-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        /* ---------- 按钮 ---------- */
        button {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: .15s;
            background: #fff;
            color: #1f2a3a;
            border: 1px solid #c2cbd8;
        }

        button:hover:not(:disabled) {
            background: #e8eef9;
            border-color: #8fa8cc;
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #1e6fd9;
            border-color: #1a5cb0;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2a7fe8;
        }

        .btn-success {
            background: #1a7a3c;
            border-color: #155f2e;
            color: #fff;
        }

        .btn-success:hover:not(:disabled) {
            background: #229a4d;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* ---------- 日志 ---------- */
        .log {
            background: #1e2530;
            color: #d4e2f5;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12.5px;
            line-height: 1.6;
            padding: 14px 16px;
            border-radius: 10px;
            height: 240px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log::-webkit-scrollbar {
            width: 8px;
        }

        .log::-webkit-scrollbar-thumb {
            background: #3a4759;
            border-radius: 4px;
        }

        /* ---------- 状态栏 ---------- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #f7f9fc;
            border-top: 1px solid #e2e8f2;
            font-size: 13px;
        }

        .badge {
            background: #eef3fc;
            color: #1e5db0;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
        }

        .badge.running {
            background: #fff3cd;
            color: #8a6d00;
        }

        .badge.ok {
            background: #d4f4dd;
            color: #1a7a3c;
        }

        .badge.err {
            background: #fde2e2;
            color: #b02a2a;
        }

        .hint {
            font-size: 12px;
            color: #7a8699;
            margin-top: 6px;
        }

        .hint.warn {
            color: #c47f00;
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <h1>🌿 Glow Lichen 属性批量修改</h1>
            <p>上传 .litematic 文件，批量修改所有发光地衣的面属性</p>
        </header>

        <div class="body">
            <!-- 文件拖拽区 -->
            <div class="field">
                <label>📁 选择或拖入 .litematic 文件</label>
                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" accept=".litematic" hidden>
                    <div class="drop-icon">📂</div>
                    <div class="drop-title">点击选择文件，或将文件拖到这里</div>
                    <div class="drop-sub">仅支持 .litematic 投影文件</div>
                    <div class="file-info" id="fileInfo" hidden>
                        <span class="file-name" id="fileName"></span>
                        <span class="file-size" id="fileSize"></span>
                        <button class="file-clear" id="fileClear" title="移除文件">✕</button>
                    </div>
                </div>
            </div>

            <!-- 面设置 -->
            <div class="field">
                <label>🎯 勾选要开启（true）的面</label>
                <div class="faces" id="faces"></div>
                <div class="quick-row">
                    <button class="btn-small" data-only="down">仅下</button>
                    <button class="btn-small" data-only="up">仅上</button>
                    <button class="btn-small" data-only="north">仅北</button>
                    <button class="btn-small" data-only="south">仅南</button>
                    <button class="btn-small" data-only="east">仅东</button>
                    <button class="btn-small" data-only="west">仅西</button>
                    <button class="btn-small" data-all="1">全开</button>
                    <button class="btn-small" data-all="0">全关</button>
                </div>
                <div class="hint">未勾选的面会被设为 false</div>
            </div>

            <!-- 处理按钮 -->
            <div class="field">
                <button id="btnRun" class="btn-primary" style="width:100%;padding:14px;">
                    ▶ 开始处理
                </button>
                <div class="hint warn" style="text-align:center;">
                    处理后的文件将另存为新文件，原文件不受影响
                </div>
            </div>

            <!-- 保存结果（处理完成后显示） -->
            <div class="field" id="saveField" hidden>
                <button id="btnSave" class="btn-success" style="width:100%;padding:14px;">
                    ⬇ 保存处理后的文件
                </button>
            </div>

            <!-- 日志 -->
            <div class="field" style="margin-bottom:0">
                <label>📜 处理日志</label>
                <div class="log" id="log">等待操作…</div>
            </div>
        </div>

        <div class="status-bar">
            <span id="status">就绪</span>
            <span class="badge" id="badge">—</span>
        </div>
    </div>

    <script>
        const FACE_LABELS = {
            down: "下 (down)", up: "上 (up)",
            north: "北 (north)", south: "南 (south)",
            east: "东 (east)", west: "西 (west)"
        };
        const FACE_KEYS = ["down", "up", "north", "south", "east", "west"];

        const $dropZone = document.getElementById("dropZone");
        const $fileInput = document.getElementById("fileInput");
        const $fileInfo = document.getElementById("fileInfo");
        const $fileName = document.getElementById("fileName");
        const $fileSize = document.getElementById("fileSize");
        const $fileClear = document.getElementById("fileClear");
        const $faces = document.getElementById("faces");
        const $log = document.getElementById("log");
        const $status = document.getElementById("status");
        const $badge = document.getElementById("badge");
        const $btnRun = document.getElementById("btnRun");
        const $saveField = document.getElementById("saveField");
        const $btnSave = document.getElementById("btnSave");

        let selectedFile = null;
        let currentTaskId = null;
        let resultBlob = null;
        let resultName = "";
        let lastLogCount = 0;
        let pollTimer = null;

        // ---------- 生成面复选框 ----------
        FACE_KEYS.forEach(k => {
            const div = document.createElement("label");
            div.className = "face-item" + (k === "down" ? " checked" : "");
            div.dataset.face = k;
            div.innerHTML = `<input type="checkbox" ${k === "down" ? "checked" : ""}>
                   <span class="box"></span>${FACE_LABELS[k]}`;
            const cb = div.querySelector("input");
            cb.addEventListener("change", () => div.classList.toggle("checked", cb.checked));
            $faces.appendChild(div);
        });

        // 快捷按钮
        document.querySelectorAll("[data-only]").forEach(b => {
            b.addEventListener("click", () => {
                const face = b.dataset.only;
                document.querySelectorAll(".face-item").forEach(el => {
                    const on = el.dataset.face === face;
                    el.querySelector("input").checked = on;
                    el.classList.toggle("checked", on);
                });
            });
        });
        document.querySelectorAll("[data-all]").forEach(b => {
            b.addEventListener("click", () => {
                const on = b.dataset.all === "1";
                document.querySelectorAll(".face-item").forEach(el => {
                    el.querySelector("input").checked = on;
                    el.classList.toggle("checked", on);
                });
            });
        });

        function collectFaces() {
            const o = {};
            document.querySelectorAll(".face-item").forEach(el => {
                o[el.dataset.face] = el.querySelector("input").checked;
            });
            return o;
        }

        // ---------- 文件选择 / 拖拽 ----------
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / 1024 / 1024).toFixed(2) + " MB";
        }

        function setFile(file) {
            if (!file) return;
            if (!file.name.toLowerCase().endsWith(".litematic")) {
                if (!confirm(`文件 "${file.name}" 不是 .litematic，仍要继续吗？`)) return;
            }
            selectedFile = file;
            $fileName.textContent = file.name;
            $fileSize.textContent = formatSize(file.size);
            $fileInfo.hidden = false;
            $dropZone.classList.add("has-file");
            $status.textContent = `已选择：${file.name}`;
            setBadge("已选择文件");
        }

        function clearFile() {
            selectedFile = null;
            $fileInput.value = "";
            $fileInfo.hidden = true;
            $dropZone.classList.remove("has-file");
            $status.textContent = "就绪";
            setBadge("—");
        }

        $dropZone.addEventListener("click", (e) => {
            if (e.target === $fileClear || $fileClear.contains(e.target)) return;
            $fileInput.click();
        });

        $fileInput.addEventListener("change", () => {
            if ($fileInput.files[0]) setFile($fileInput.files[0]);
        });

        $fileClear.addEventListener("click", (e) => {
            e.stopPropagation();
            clearFile();
        });

        ["dragenter", "dragover"].forEach(ev => {
            $dropZone.addEventListener(ev, (e) => {
                e.preventDefault();
                e.stopPropagation();
                $dropZone.classList.add("drag-over");
            });
        });

        ["dragleave", "drop"].forEach(ev => {
            $dropZone.addEventListener(ev, (e) => {
                e.preventDefault();
                e.stopPropagation();
                $dropZone.classList.remove("drag-over");
            });
        });

        $dropZone.addEventListener("drop", (e) => {
            const files = e.dataTransfer.files;
            if (files && files.length) setFile(files[0]);
        });

        // 阻止整页拖拽默认行为（避免浏览器直接打开文件）
        document.addEventListener("dragover", e => e.preventDefault());
        document.addEventListener("drop", e => e.preventDefault());

        // ---------- UI 工具 ----------
        function setBadge(text, cls) {
            $badge.textContent = text;
            $badge.className = "badge" + (cls ? " " + cls : "");
        }

        // ---------- 处理 ----------
        async function startProcess() {
            if (!selectedFile) {
                alert("请先选择或拖入一个 .litematic 文件");
                return;
            }

            const faces = collectFaces();
            const enabled = Object.entries(faces).filter(([k, v]) => v).map(([k]) => k);
            const faceStr = enabled.length
                ? enabled.map(k => FACE_LABELS[k].split(" ")[0]).join("、")
                : "（无，全部关闭）";

            if (!confirm(`即将处理：\n${selectedFile.name}\n\n开启的面：${faceStr}\n\n继续？`)) return;

            $btnRun.disabled = true;
            $saveField.hidden = true;
            resultBlob = null;
            resultName = "";
            currentTaskId = null;
            lastLogCount = 0;
            $log.textContent = "正在上传文件…";
            $status.textContent = "正在上传…";
            setBadge("上传中", "running");

            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("faces", JSON.stringify(faces));
            formData.append("waterlogged", "false");

            try {
                const res = await fetch("/api/process", { method: "POST", body: formData });
                const data = await res.json();
                if (!data.ok) {
                    alert(data.msg || "启动失败");
                    $btnRun.disabled = false;
                    setBadge("失败", "err");
                    return;
                }
                currentTaskId = data.task_id;
                $status.textContent = "正在处理…";
                setBadge("处理中", "running");
                startPolling();
            } catch (e) {
                alert("上传失败：" + e);
                $btnRun.disabled = false;
                setBadge("失败", "err");
            }
        }

        function startPolling() {
            if (pollTimer) clearTimeout(pollTimer);
            poll();
        }

        async function poll() {
            if (!currentTaskId) return;
            try {
                const res = await fetch(`/api/status/${currentTaskId}`);
                const data = await res.json();
                if (!data.ok) throw new Error(data.msg || "任务不存在");

                if (data.logs.length !== lastLogCount) {
                    $log.textContent = data.logs.join("\n");
                    $log.scrollTop = $log.scrollHeight;
                    lastLogCount = data.logs.length;
                }

                if (data.done) {
                    $btnRun.disabled = false;
                    if (data.error) {
                        $status.textContent = "处理失败：" + data.error;
                        setBadge("失败", "err");
                        return;
                    }

                    const r = data.result || {};
                    $status.textContent = `处理完成：替换 ${r.replaced} 个`;
                    setBadge(`${r.replaced} 替换 · 完成`, "ok");

                    // 拉取结果文件到内存
                    try {
                        const dres = await fetch(`/api/download/${currentTaskId}`);
                        if (dres.ok) {
                            resultBlob = await dres.blob();
                            const base = selectedFile.name.replace(/\.litematic$/i, "");
                            resultName = base + "_修改.litematic";
                            $saveField.hidden = false;
                        }
                    } catch (e) {
                        console.error("下载结果失败", e);
                    }
                    return;
                }

                if (data.running) {
                    $status.textContent = "正在处理…";
                }
                pollTimer = setTimeout(poll, 500);
            } catch (e) {
                $status.textContent = "轮询失败：" + e;
                pollTimer = setTimeout(poll, 1500);
            }
        }

        // ---------- 保存结果 ----------
        async function saveResult() {
            if (!resultBlob) {
                alert("没有可保存的文件");
                return;
            }

            // 优先用 File System Access API（可弹"另存为"，能真正覆盖原文件）
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: resultName,
                        types: [{
                            description: "Litematic 投影文件",
                            accept: { "application/octet-stream": [".litematic"] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(resultBlob);
                    await writable.close();
                    $status.textContent = "已保存：" + handle.name;
                    setBadge("已保存", "ok");
                    return;
                } catch (e) {
                    if (e.name === "AbortError") return;   // 用户取消
                    console.warn("showSaveFilePicker 失败，回退到下载", e);
                }
            }

            // 回退：a.download
            const url = URL.createObjectURL(resultBlob);
            const a = document.createElement("a");
            a.href = url;
            a.download = resultName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            $status.textContent = "已下载：" + resultName;
            setBadge("已下载", "ok");
        }

        $btnRun.addEventListener("click", startProcess);
        $btnSave.addEventListener("click", saveResult);
    </script>
</body>

</html>
